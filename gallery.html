<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="cloud-nav">
    <a href="index.html">🎵 Cloud Music</a>
    <a href="video.html">🎬 Cloud Video</a>
    <a href="gallery.html" class="active">🖼️ Cloud Gallery</a>
</nav>

<main class="gallery-page">

    <div class="gallery-header">
        <div>
            <h1>🖼️ Cloud Gallery</h1>
            <p>Your images from Google Drive</p>
        </div>

        <input
            type="search"
            id="gallerySearch"
            placeholder="🔍 Search images..."
            autocomplete="off"
        >
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>

    <div id="galleryEmpty" class="gallery-empty">
        No images found.
    </div>

</main>

<div id="imageViewer" class="image-viewer">
    <button id="closeViewer" class="viewer-close">✕</button>
    <button id="prevImage" class="viewer-arrow viewer-prev">‹</button>

    <img id="viewerImage" src="" alt="">

    <button id="nextImage" class="viewer-arrow viewer-next">›</button>

    <div id="viewerTitle" class="viewer-title"></div>
</div>

<script src="gallery.js"></script>

</body>
</html>
